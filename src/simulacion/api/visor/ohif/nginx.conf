server {
    listen 80;
    server_name _;

    # OHIF frontend
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://ottava-ohif-app:80;
    }

    # Orthanc DICOMweb through the SAME browser origin.
    location /dicom-web/ {
        proxy_http_version 1.1;
        proxy_set_header Host host.docker.internal:8042;
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_pass http://host.docker.internal:8042/dicom-web/;
    }

    # WADO-URI fallback
    location /wado {
        proxy_http_version 1.1;
        proxy_set_header Host host.docker.internal:8042;
        proxy_pass http://host.docker.internal:8042/wado;
    }
}
